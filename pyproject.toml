[project]
name = "caltrain-tracker"
version = "0.1.0"
description = "Caltrain on-time performance tracker: 511 collector, DuckDB nightly build, static dashboard data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.3",
    "numpy>=2.4.1,<2.5",  # pandas 2.3 trips numpy 2.5 timedelta deprecations
    "pandas>=2.3.3,<3",  # 3.x copy-on-write changes chained-assignment behaviour; audit before lifting
    "plotly>=6.5.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
notebooks = [
    "ipykernel>=7.1.0",
    "nbformat>=5.10.4",
    "polars>=1.36.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
