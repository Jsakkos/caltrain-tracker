# Only the collector runs as a container. Everything else (GTFS check, nightly
# build, backup, website export) is a host cron job: see deploy/crontab.txt.
services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    environment:
      - API_KEY=${API_KEY}
      - DB_PATH=/app/data/caltrain_lat_long.db
    volumes:
      - ./data:/app/data
    restart: always
    stop_grace_period: 40s  # a fetch in flight can take up to its 30 s timeout
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
